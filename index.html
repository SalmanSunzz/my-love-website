<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ถึงเธอ 💗</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffdce8, #eee3ff, #ddf5ee);
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
    }

    .heart {
      font-size: 80px;
      animation: beat 1.2s infinite;
    }

    h1 {
      color: #e4779b;
      font-size: 32px;
    }

    p {
      color: #666;
      font-size: 18px;
      line-height: 1.8;
    }

    button {
      border: none;
      background: #ed8da9;
      color: white;
      padding: 14px 30px;
      border-radius: 30px;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 5px 15px #0002;
    }

    button:hover {
      transform: scale(1.05);
    }

    @keyframes beat {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.15);
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="heart">💗</div>

    <h1>มีอะไรอยากบอกเธอหน่อย</h1>

    <p>
      ขอเวลาเธอสักแป๊บนึงนะ 🥺<br>
      เราตั้งใจทำสิ่งนี้ให้เธอ
    </p>

    <button onclick="alert('ขอบคุณที่กดเข้ามาดูนะ 💕')">
      เปิดดูหน่อยได้มั้ย
    </button>

  </div>

</body>
</html>
